global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # External scrape of the k8s-ha API VIP (Bearer token file, not committed).
  - job_name: kubernetes-apiservers
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/secrets/k8s-bearer.token
    kubernetes_sd_configs:
      - role: endpoints
        api_server: https://172.16.30.10:6443
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /etc/prometheus/secrets/k8s-bearer.token
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_namespace
          - __meta_kubernetes_service_name
          - __meta_kubernetes_endpoint_port_name
        action: keep
        regex: default;kubernetes;https

  - job_name: kubernetes-nodes
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/secrets/k8s-bearer.token
    kubernetes_sd_configs:
      - role: node
        api_server: https://172.16.30.10:6443
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /etc/prometheus/secrets/k8s-bearer.token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: 172.16.30.10:6443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  - job_name: kubernetes-nodes-cadvisor
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/secrets/k8s-bearer.token
    kubernetes_sd_configs:
      - role: node
        api_server: https://172.16.30.10:6443
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /etc/prometheus/secrets/k8s-bearer.token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: 172.16.30.10:6443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  # LAN-reachable annotated endpoints only (node-exporter hostNetwork).
  # Drop pod CIDR — external Prometheus cannot route 10.244.0.0/16.
  - job_name: kubernetes-service-endpoints
    honor_labels: true
    kubernetes_sd_configs:
      - role: endpoints
        api_server: https://172.16.30.10:6443
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /etc/prometheus/secrets/k8s-bearer.token
    relabel_configs:
      - source_labels:
          [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__address__]
        regex: "172\\.16\\..+"
        action: keep
      - source_labels:
          [__meta_kubernetes_service_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (https?)
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          - __address__
          - __meta_kubernetes_service_annotation_prometheus_io_port
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2

  # kube-state-metrics via API service proxy (no pod-network routing needed).
  - job_name: kube-state-metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /etc/prometheus/secrets/k8s-bearer.token
    metrics_path: /api/v1/namespaces/monitoring/services/kube-state-metrics:http/proxy/metrics
    static_configs:
      - targets:
          - 172.16.30.10:6443

  - job_name: pve-nodes
    static_configs:
      - targets:
          - 172.16.0.101:9100
          - 172.16.0.102:9100
          - 172.16.0.103:9100
          - 172.16.0.104:9100
        labels:
          cluster: pvecm-oldtimers
          role: pve-node
