groups:
  - name: papita.k8s.recording
    interval: 30s
    rules:
      - record: papita:apiserver_request:rate5m
        expr: sum(rate(apiserver_request_total[5m]))
      - record: papita:apiserver_request_5xx:rate5m
        expr: sum(rate(apiserver_request_total{code=~"5.."}[5m]))
      - record: papita:apiserver_error_ratio:rate5m
        expr: |
          papita:apiserver_request_5xx:rate5m
          /
          clamp_min(papita:apiserver_request:rate5m, 0.001)
      - record: papita:kube_nodes_ready
        expr: sum(kube_node_status_condition{condition="Ready",status="true"}) or vector(0)
      - record: papita:kube_pods_running
        expr: sum(kube_pod_status_phase{phase="Running"}) or vector(0)

  - name: papita.k8s.alerts
    rules:
      - alert: KubeAPIServerDown
        expr: sum(up{job="kubernetes-apiservers"}) < 1
        for: 2m
        labels:
          severity: critical
          cluster: k8s-oldtimers
        annotations:
          summary: "No Kubernetes API server scrape is up"
          description: "All kubernetes-apiservers targets are down for 2m."

      - alert: KubeAPIHighErrorRatio
        expr: papita:apiserver_error_ratio:rate5m > 0.05
        for: 10m
        labels:
          severity: warning
          cluster: k8s-oldtimers
        annotations:
          summary: "API 5xx ratio above 5%"
          description: "apiserver 5xx / total request rate is {{ $value | humanizePercentage }}."

      - alert: KubeStateMetricsDown
        expr: up{job="kube-state-metrics"} == 0
        for: 10m
        labels:
          severity: warning
          cluster: k8s-oldtimers
        annotations:
          summary: "kube-state-metrics scrape failed"
          description: "Pod inventory panels will be empty until monitoring/kube-state-metrics is Ready."

      - alert: KubeletMetricsDown
        expr: sum(up{job="kubernetes-nodes"}) == 0
        for: 5m
        labels:
          severity: warning
          cluster: k8s-oldtimers
        annotations:
          summary: "All kubelet metric proxies are down"
          description: "Check kubelet DNS for api.k8s.oldtimers.lab and nodes/proxy RBAC."

      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          cluster: k8s-oldtimers
        annotations:
          summary: "Kubernetes node {{ $labels.node }} not Ready"
          description: "kube_node_status_condition Ready=true is 0."

      - alert: KubePodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
        for: 15m
        labels:
          severity: warning
          cluster: k8s-oldtimers
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting"
          description: "More than 5 container restarts in 1h."

      - alert: KubeDeploymentUnavailable
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 15m
        labels:
          severity: warning
          cluster: k8s-oldtimers
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} unavailable replicas"
          description: "{{ $value }} replicas unavailable for 15m."
