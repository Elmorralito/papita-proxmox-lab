# External Prometheus stack on k8s-monitor Debian LXC (CT 231).
# Sync with papita-sync-k8s-monitor.sh. Secrets stay on the CT (not in git).
# Token: k8s-monitor/secrets/k8s-bearer.token (see secrets/README.txt).
# Grafana moved to raspi-qdevice-oldtimers (../qdevice-grafana/); it queries :9090 here.

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "kubernetes.default.svc:172.16.30.10"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Single-instance lab: disable gossip mesh (avoids crash when Docker has no private IP yet)
      - --cluster.listen-address=
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

volumes:
  prometheus_data:
  alertmanager_data:
