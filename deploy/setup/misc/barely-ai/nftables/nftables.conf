#!/usr/sbin/nft -f
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ip protocol icmp accept
		ip6 nexthdr ipv6-icmp accept

		# Management + AI APIs: LAN and Tailscale only (not WAN/public)
		tcp dport 22 ip saddr { 172.16.0.0/16, 100.64.0.0/10 } accept
		tcp dport { 8009, 8080 } ip saddr { 172.16.0.0/16, 100.64.0.0/10 } accept

		# Explicit reject for known ports from elsewhere (clearer than drop)
		tcp dport { 22, 8009, 8080 } reject with tcp reset
		counter drop
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	# Outbound web/maintenance (apt, HF, CUDA repos) unrestricted
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
